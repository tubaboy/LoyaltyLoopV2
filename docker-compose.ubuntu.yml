name: loyaltyloop-v2-ubuntu

services:
  db:
    image: postgres:16-alpine
    container_name: loyaltyloop-v2-db
    environment:
      POSTGRES_DB: loyaltyloop_v2
      POSTGRES_USER: loyaltyloop
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      PGPASSFILE: /var/lib/postgresql/data/.pgpass
    volumes:
      - postgres_standby_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U loyaltyloop -d loyaltyloop_v2"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  media-sync:
    build:
      context: ./apps/media-sync
      dockerfile: Dockerfile
    container_name: loyaltyloop-v2-media-sync
    network_mode: host
    environment:
      MEDIA_SYNC_BIND_ADDRESS: ${MEDIA_SYNC_BIND_ADDRESS:?Set MEDIA_SYNC_BIND_ADDRESS in .env.ubuntu}
      MEDIA_SYNC_PORT: 18765
      MEDIA_SYNC_TOKEN: ${MEDIA_SYNC_TOKEN:?Set MEDIA_SYNC_TOKEN in .env.ubuntu}
      MEDIA_SYNC_PATH: /var/lib/loyaltyloop/media
      MEDIA_SYNC_STATE_PATH: /var/lib/loyaltyloop/media-sync-state
      MEDIA_SYNC_DELETE_GRACE_MS: 604800000
    volumes:
      - media_data:/var/lib/loyaltyloop/media
      - media_sync_state:/var/lib/loyaltyloop/media-sync-state
    restart: unless-stopped

  api:
    profiles: ["primary"]
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    container_name: loyaltyloop-v2-api
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgresql://loyaltyloop:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@db:5432/loyaltyloop_v2
      COOKIE_SECURE: "true"
      CORS_ORIGIN: https://122.116.231.49
      LOCAL_STORAGE_PATH: /var/lib/loyaltyloop/media
    volumes:
      - media_data:/var/lib/loyaltyloop/media
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/readyz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  web:
    profiles: ["primary"]
    build:
      context: ./apps/web
      dockerfile: Dockerfile.ubuntu
    container_name: loyaltyloop-v2-proxy
    environment:
      API_UPSTREAM: http://api:3000
    ports:
      - "80:8080"
      - "443:8443"
    volumes:
      - letsencrypt:/etc/letsencrypt:ro
      - acme_webroot:/var/www/certbot:ro
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  certbot:
    image: certbot/certbot:v5.4.0
    profiles: ["certificates"]
    network_mode: host
    volumes:
      - letsencrypt:/etc/letsencrypt
      - acme_webroot:/var/www/certbot
    entrypoint: ["certbot"]

volumes:
  postgres_data:
    name: loyaltyloop_v2_ubuntu_postgres
  postgres_standby_data:
    external: true
    name: loyaltyloop_v2_ubuntu_postgres_standby
  media_data:
    name: loyaltyloop_v2_ubuntu_media
  media_sync_state:
    name: loyaltyloop_v2_ubuntu_media_sync_state
  letsencrypt:
    name: loyaltyloop_v2_ubuntu_letsencrypt
  acme_webroot:
    name: loyaltyloop_v2_ubuntu_acme
