name: loyaltyloop-v2-dev

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-loyaltyloop_v2}
      POSTGRES_USER: ${POSTGRES_USER:-loyaltyloop}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    build:
      context: ./apps/api
    command: npm run dev
    environment:
      NODE_ENV: development
      PORT: 3000
      DATABASE_URL: postgresql://${POSTGRES_USER:-loyaltyloop}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@db:5432/${POSTGRES_DB:-loyaltyloop_v2}
      CORS_ORIGIN: http://localhost:5173
      LOCAL_STORAGE_PATH: /var/lib/loyaltyloop/media
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - ./apps/api/src:/app/src
      - media_data:/var/lib/loyaltyloop/media
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  web:
    build:
      context: ./apps/web
    environment:
      VITE_API_BASE_URL: http://localhost:3000
    ports:
      - "127.0.0.1:5173:5173"
    volumes:
      - ./apps/web/src:/app/src
      - ./apps/web/public:/app/public
      - ./apps/web/vite.config.js:/app/vite.config.js
    depends_on:
      - api
    restart: unless-stopped

  web-production-preview:
    profiles: ["tablet-preview"]
    build:
      context: ./apps/web
      dockerfile: Dockerfile.railway
    environment:
      PORT: 8080
      API_UPSTREAM: http://api:3000
    ports:
      - "127.0.0.1:4174:8080"
    depends_on:
      - api
    restart: unless-stopped

volumes:
  postgres_data:
  media_data:

