name: loyaltyloop-v2-dev

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-loyaltyloop_v2}
      POSTGRES_USER: ${POSTGRES_USER:-loyaltyloop}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-loyaltyloop_local}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD in .env}
    ports:
      - "127.0.0.1:19000:9000"
      - "127.0.0.1:19001:9001"
    volumes:
      - minio_data:/data

  api:
    build:
      context: ./apps/api
    command: npm run dev
    environment:
      NODE_ENV: development
      PORT: 3000
      DATABASE_URL: postgresql://${POSTGRES_USER:-loyaltyloop}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@db:5432/${POSTGRES_DB:-loyaltyloop_v2}
      CORS_ORIGIN: http://localhost:5173
      S3_ENDPOINT: http://minio:9000
      S3_REGION: us-east-1
      S3_BUCKET: loyaltyloop-v2
      S3_FORCE_PATH_STYLE: "true"
      S3_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-loyaltyloop_local}
      S3_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD in .env}
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - ./apps/api/src:/app/src
    depends_on:
      db:
        condition: service_healthy
      minio:
        condition: service_started
    restart: unless-stopped

  web:
    build:
      context: ./apps/web
    environment:
      VITE_API_BASE_URL: http://localhost:3000
    ports:
      - "127.0.0.1:5173:5173"
    volumes:
      - ./apps/web/src:/app/src
      - ./apps/web/public:/app/public
      - ./apps/web/vite.config.js:/app/vite.config.js
    depends_on:
      - api
    restart: unless-stopped

  web-production-preview:
    profiles: ["tablet-preview"]
    build:
      context: ./apps/web
      dockerfile: Dockerfile.railway
    environment:
      PORT: 8080
      API_UPSTREAM: http://api:3000
    ports:
      - "127.0.0.1:4174:8080"
    depends_on:
      - api
    restart: unless-stopped

volumes:
  postgres_data:
  minio_data:

